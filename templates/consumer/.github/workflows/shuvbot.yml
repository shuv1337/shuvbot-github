name: shuvbot

# Template for running shuvbot in another repository.
#
# Copy this file to `.github/workflows/shuvbot.yml`, copy
# `templates/consumer/.github/shuvbot.ci.toml` to `.github/shuvbot.ci.toml`,
# and add the `CLAUDE_CODE_OAUTH_TOKEN` repository secret. Nothing else is
# required: the repository does not need a package.json, a lockfile, or any
# dependency on shuvbot. See docs/workflows.md, "Using shuvbot in another
# repository".
#
# Manual only. shuvbot reviews when it is explicitly asked to, by mentioning it
# in a comment on a pull request - never automatically on push or on open.
#
# Two comment events, because "commenting on a pull request" is two different
# GitHub events that look like one act from the UI: `issue_comment` is the
# conversation tab, `pull_request_review_comment` is an inline comment on a
# diff line. Subscribing to only one makes the other silently do nothing.
on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions: {} # deny by default

# One review at a time per pull request. Not cancel-in-progress: a review
# someone asked for by commenting should finish rather than be replaced.
concurrency:
  group: shuvbot-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: shuvbot review
    # Only one trusted login, only an explicit @shuvbot mention, and only on a
    # pull request comment.
    #
    # `issue_comment` also fires for plain issues. No mode handles an issue yet,
    # so an issue mention would only start a job that fails closed and leaves a
    # red X. `issue.pull_request` is present only when the issue is a pull
    # request, so it is the cheapest place to stop that.
    #
    # `comment.user.login` is set by GitHub and cannot be spoofed, so this is a
    # real gate - but it is the *only* identity gate. The action independently
    # re-checks write access and never checks who the actor is, so do not
    # weaken this line expecting shuvbot to catch it.
    if: >-
      github.event.comment.user.login == 'shuv1337' &&
      contains(github.event.comment.body, '@shuvbot') &&
      ((github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null) ||
        github.event_name == 'pull_request_review_comment')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    steps:
      # The action code comes from the `uses:` ref below and the pull request
      # diff comes from GitHub's API, so this checkout exists only to give the
      # review runtime somewhere to be installed. Check out the trusted default
      # branch anyway: the install step runs inside this checkout, and a pull
      # request must not be able to plant a registry override (bunfig.toml,
      # .npmrc) that the runtime download would honour.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2

      # The action bundle is self-contained and never runs a package manager,
      # so the workflow installs the pinned review runtime. `--no-save` leaves
      # this repository's package.json and lockfile untouched, and needs
      # neither to exist. `--ignore-scripts` keeps this repository's own
      # lifecycle scripts from running in a job that holds the provider
      # credential; the runtime itself needs no install scripts.
      #
      # The version must equal review.shuvcode.version in
      # .github/shuvbot.ci.toml, or the review fails before it starts.
      - name: Install the review runtime
        run: bun add --no-save --ignore-scripts shuvcode@2.0.0-alpha-9

      # `master` tracks the latest reviewed shuvbot code. For reproducible runs
      # pin an exact commit SHA of shuv1337/shuvbot-github and move it
      # deliberately. The published `v0` tag predates the coordinator engine
      # and does not work with this workflow.
      - name: Run shuvbot
        uses: shuv1337/shuvbot-github@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          engine: coordinator
          # The action falls back to local-profile auth without this and
          # refuses to start on a runner.
          config: .github/shuvbot.ci.toml
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Upload shuvbot artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: shuvbot
          path: ${{ runner.temp }}/shuvbot
          if-no-files-found: warn
